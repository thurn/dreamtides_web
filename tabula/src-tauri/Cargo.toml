[package]
name = "tabula"
version = "0.1.0"
description = "Dreamtides RON editor"
edition = "2024"

[lib]
name = "tabula_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
png = "0.18"
tauri-build = { version = "2", features = [] }

[dependencies]
dreamtides-game-data = { path = "../../tools/game-data" }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
