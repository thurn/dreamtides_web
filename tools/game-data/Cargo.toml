[package]
name = "dreamtides-game-data"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
indexmap = { version = "2.11", features = ["serde"] }
ron = "0.12.0"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3.23"
thiserror = "2.0"
toml = { version = "0.9", features = ["preserve_order"] }
trox = { git = "https://github.com/thurn/trox.git", rev = "7273c252e904752945833911ef82bc2e1ad67c60" }
uuid = { version = "1.18", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1.4"
proptest = "1.9"
