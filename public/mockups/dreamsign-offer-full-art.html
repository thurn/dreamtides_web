<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dreamsign Offer Full-Art Study</title>
    <style>
      :root {
        --background-blur: 0px;
        --dreamsign-size: 28%;
        --dreamsign-low: 21%;
        --dreamsign-high: 51%;
        --dreamsign-center: 36%;
        --dreamsign-triangle-left: 23.01%;
        --dreamsign-triangle-right: 48.99%;
        --dreamsign-triangle-bottom: 43.5%;
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #10091a;
        color: #fff9e9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
      }

      .scene {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        background: #10091a;
      }

      .scene__art {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .study {
        position: relative;
        z-index: 1;
        width: min(1240px, 100%);
        padding: 28px 28px 36px;
      }

      .study__header {
        display: grid;
        justify-items: center;
        margin-bottom: 8px;
        text-align: center;
        text-shadow:
          -2px -2px 0 #050207,
          2px -2px 0 #050207,
          -2px 2px 0 #050207,
          2px 2px 0 #050207,
          0 5px 12px #050207;
      }

      .study__eyebrow {
        margin: 0 0 5px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .study__title {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(28px, 3vw, 44px);
        line-height: 1;
      }

      .offers {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: start;
        justify-items: center;
        gap: 10px;
      }

      .offer {
        display: grid;
        justify-items: center;
      }

      .offer-tile {
        position: relative;
        width: min(460px, 43vw);
        aspect-ratio: 756 / 769;
        isolation: isolate;
      }

      .offer-tile__fill {
        position: absolute;
        inset: 0;
        z-index: 0;
        contain: paint;
        overflow: hidden;
        clip-path: inset(0);
        -webkit-mask: url("/src/cumulus/assets/offer_tile_black_fill.png")
          center / contain no-repeat;
        mask: url("/src/cumulus/assets/offer_tile_black_fill.png") center /
          contain no-repeat;
        background: #050207;
      }

      .offer-tile__background {
        position: absolute;
        inset: -10%;
        display: block;
        width: 120%;
        height: 120%;
        object-fit: cover;
        object-position: 50% 42%;
        filter: blur(var(--background-blur));
      }

      .offer-tile__frame {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }

      .offer-tile__symbols {
        position: absolute;
        left: 15.35%;
        top: 9.1%;
        z-index: 2;
        width: 69.3%;
        height: 68.1%;
        pointer-events: none;
      }

      .offer-tile__symbols--single {
        display: grid;
        place-items: center;
      }

      .offer-tile__symbols--draft {
        display: block;
      }

      .offer-tile__dreamsign {
        display: block;
        object-fit: contain;
        filter: drop-shadow(0 4px 0 rgba(3, 1, 5, 0.88))
          drop-shadow(0 10px 13px rgba(3, 1, 5, 0.9));
      }

      .offer-tile__symbols--single .offer-tile__dreamsign {
        width: 54%;
        height: 54%;
      }

      .offer-tile__symbols--draft .offer-tile__dreamsign {
        /* Past 17% spread, the controls gradually reduce icon size so the
           25% extreme still preserves a gap inside the circular frame. */
        position: absolute;
        width: var(--dreamsign-size);
        height: var(--dreamsign-size);
      }

      .offer-tile__symbols--draft .offer-tile__dreamsign:nth-child(1) {
        left: var(--dreamsign-low);
        top: var(--dreamsign-low);
      }

      .offer-tile__symbols--draft .offer-tile__dreamsign:nth-child(2) {
        left: var(--dreamsign-high);
        top: var(--dreamsign-low);
      }

      .offer-tile__symbols--draft .offer-tile__dreamsign:nth-child(3) {
        left: var(--dreamsign-low);
        top: var(--dreamsign-high);
      }

      .offer-tile__symbols--draft .offer-tile__dreamsign:nth-child(4) {
        left: var(--dreamsign-high);
        top: var(--dreamsign-high);
      }

      .offer-tile__symbols--draft[data-count="2"]
        .offer-tile__dreamsign:nth-child(1) {
        left: var(--dreamsign-low);
        top: var(--dreamsign-center);
      }

      .offer-tile__symbols--draft[data-count="2"]
        .offer-tile__dreamsign:nth-child(2) {
        left: var(--dreamsign-high);
        top: var(--dreamsign-center);
      }

      .offer-tile__symbols--draft[data-count="2"]
        .offer-tile__dreamsign:nth-child(n + 3) {
        display: none;
      }

      .offer-tile__symbols--draft[data-count="3"]
        .offer-tile__dreamsign:nth-child(1) {
        left: var(--dreamsign-center);
        top: var(--dreamsign-low);
      }

      .offer-tile__symbols--draft[data-count="3"]
        .offer-tile__dreamsign:nth-child(2) {
        left: var(--dreamsign-triangle-left);
        top: var(--dreamsign-triangle-bottom);
      }

      .offer-tile__symbols--draft[data-count="3"]
        .offer-tile__dreamsign:nth-child(3) {
        left: var(--dreamsign-triangle-right);
        top: var(--dreamsign-triangle-bottom);
      }

      .offer-tile__symbols--draft[data-count="3"]
        .offer-tile__dreamsign:nth-child(4) {
        display: none;
      }

      .offer__caption {
        max-width: 460px;
        margin: -4px 0 0;
        font-size: clamp(16px, 1.8vw, 24px);
        font-weight: 850;
        line-height: 1.15;
        text-align: center;
        text-shadow:
          -2px -2px 0 #050207,
          2px -2px 0 #050207,
          -2px 2px 0 #050207,
          2px 2px 0 #050207,
          0 4px 8px #050207;
      }

      .picker {
        display: grid;
        width: min(840px, 100%);
        margin: 14px auto 0;
        padding: 11px 14px 13px;
        gap: 9px;
        border: 1px solid rgba(255, 249, 233, 0.24);
        border-radius: 18px;
        background: rgba(17, 8, 29, 0.78);
        box-shadow: 0 16px 42px rgba(2, 0, 5, 0.42);
        backdrop-filter: blur(18px) saturate(1.15);
      }

      .picker__label {
        margin: 0;
        color: rgba(255, 249, 233, 0.82);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-align: center;
        text-transform: uppercase;
      }

      .picker__choices {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 8px;
      }

      .picker__choice {
        position: relative;
        min-width: 0;
        padding: 0;
        overflow: hidden;
        aspect-ratio: 16 / 10;
        border: 2px solid transparent;
        border-radius: 10px;
        background: #050207;
        color: #fff9e9;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(2, 0, 5, 0.42);
      }

      .picker__choice[aria-pressed="true"] {
        border-color: #f5e777;
        box-shadow:
          0 0 0 2px rgba(5, 2, 7, 0.9),
          0 0 20px rgba(245, 231, 119, 0.54);
      }

      .picker__choice img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .picker__choice span {
        position: absolute;
        right: 5px;
        bottom: 4px;
        padding: 2px 5px;
        border-radius: 999px;
        background: rgba(5, 2, 7, 0.82);
        font-size: 10px;
        font-weight: 800;
      }

      .range-control {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) 48px;
        align-items: center;
        gap: 12px;
      }

      .range-control__label,
      .count-control__label,
      .randomize-control__label {
        color: rgba(255, 249, 233, 0.82);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .range-control__input {
        width: 100%;
        accent-color: #f5e777;
        cursor: pointer;
      }

      .range-control__value {
        color: #fff9e9;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        font-weight: 800;
        text-align: right;
      }

      .count-control {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 12px;
      }

      .count-control__buttons {
        justify-self: end;
        display: grid;
        grid-auto-flow: column;
        padding: 2px;
        gap: 2px;
        border-radius: 999px;
        background: rgba(5, 2, 7, 0.72);
      }

      .count-control__button {
        min-width: 56px;
        padding: 6px 12px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 249, 233, 0.76);
        font: inherit;
        font-size: 12px;
        font-weight: 850;
        cursor: pointer;
      }

      .count-control__button[aria-pressed="true"] {
        border-color: rgba(245, 231, 119, 0.62);
        background: rgba(245, 231, 119, 0.18);
        color: #fff9e9;
      }

      .randomize-control {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 12px;
      }

      .randomize-control__actions {
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .randomize-control__status {
        color: rgba(255, 249, 233, 0.68);
        font-size: 11px;
        font-weight: 700;
      }

      .randomize-control__button {
        padding: 7px 13px;
        border: 1px solid rgba(245, 231, 119, 0.62);
        border-radius: 999px;
        background: rgba(245, 231, 119, 0.14);
        color: #fff9e9;
        font: inherit;
        font-size: 12px;
        font-weight: 850;
        cursor: pointer;
      }

      .randomize-control__button:disabled {
        opacity: 0.48;
        cursor: wait;
      }

      @media (max-width: 760px) {
        .study {
          padding: 18px 12px 28px;
        }

        .offers {
          grid-template-columns: 1fr;
          gap: 8px;
        }

        .offer-tile {
          width: min(390px, 92vw);
        }

        .picker {
          margin-top: 8px;
        }

        .picker__choices {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 5px;
        }

        .picker__choice span {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <img class="scene__art" src="/dreamscapes/wilderveil.png" alt="" />
      <section class="study" aria-labelledby="study-title">
        <header class="study__header">
          <p class="study__eyebrow">Temporary Visual Study</p>
          <h1 class="study__title" id="study-title">
            Full-Art Dreamsign Offers
          </h1>
        </header>

        <div class="offers">
          <article class="offer">
            <div
              class="offer-tile"
              aria-label="One preselected Dreamsign over full card art"
            >
              <div class="offer-tile__fill">
                <img
                  class="offer-tile__background"
                  id="gift-background"
                  src="/cards/420863587.webp"
                  alt=""
                />
                <div class="offer-tile__symbols offer-tile__symbols--single">
                  <img
                    class="offer-tile__dreamsign"
                    src="/dreamsigns/horn_rainbow%20.png"
                    alt="Rainbow Horn"
                  />
                </div>
              </div>
              <img
                class="offer-tile__frame"
                src="/src/cumulus/assets/dreamsign_card_frame_2.png"
                alt=""
              />
            </div>
            <p class="offer__caption">1 preselected dreamsign</p>
          </article>

          <article class="offer">
            <div
              class="offer-tile"
              aria-label="Four Dreamsign choices over one full card-art background"
            >
              <div class="offer-tile__fill">
                <img
                  class="offer-tile__background"
                  id="draft-background"
                  src="/cards/420863587.webp"
                  alt=""
                />
                <div
                  class="offer-tile__symbols offer-tile__symbols--draft"
                  id="draft-symbols"
                  data-count="4"
                >
                  <img
                    class="offer-tile__dreamsign"
                    src="/dreamsigns/horn_rainbow%20.png"
                    alt="Rainbow Horn"
                  />
                  <img
                    class="offer-tile__dreamsign"
                    src="/dreamsigns/aertfact.png"
                    alt="Pyramid Relic"
                  />
                  <img
                    class="offer-tile__dreamsign"
                    src="/dreamsigns/amanita.png"
                    alt="Amanita"
                  />
                  <img
                    class="offer-tile__dreamsign"
                    src="/dreamsigns/algae.png"
                    alt="Algae"
                  />
                </div>
              </div>
              <img
                class="offer-tile__frame"
                src="/src/cumulus/assets/dreamsign_card_frame_2.png"
                alt=""
              />
            </div>
            <p class="offer__caption" id="draft-caption">
              4 choices · all shown
            </p>
          </article>
        </div>

        <div class="picker">
          <p class="picker__label">
            Choose one full-art backdrop for both offer variants
          </p>
          <div class="picker__choices" id="picker-choices"></div>
          <div class="range-control">
            <label class="range-control__label" for="background-blur">
              Background blur
            </label>
            <input
              class="range-control__input"
              id="background-blur"
              type="range"
              min="0"
              max="18"
              step="1"
              value="0"
            />
            <output
              class="range-control__value"
              id="background-blur-value"
              for="background-blur"
            >
              0 px
            </output>
          </div>
          <div class="range-control">
            <label class="range-control__label" for="dreamsign-spread">
              Group spread
            </label>
            <input
              class="range-control__input"
              id="dreamsign-spread"
              type="range"
              min="12"
              max="25"
              step="1"
              value="15"
            />
            <output
              class="range-control__value"
              id="dreamsign-spread-value"
              for="dreamsign-spread"
            >
              15%
            </output>
          </div>
          <div
            class="count-control"
            role="group"
            aria-label="Shown Dreamsign count"
          >
            <span class="count-control__label">Shown Dreamsigns</span>
            <div class="count-control__buttons">
              <button
                class="count-control__button"
                type="button"
                data-dreamsign-count="2"
                aria-pressed="false"
              >
                2
              </button>
              <button
                class="count-control__button"
                type="button"
                data-dreamsign-count="3"
                aria-pressed="false"
              >
                3
              </button>
              <button
                class="count-control__button"
                type="button"
                data-dreamsign-count="4"
                aria-pressed="true"
              >
                4
              </button>
            </div>
          </div>
          <div class="randomize-control">
            <span class="randomize-control__label">Dreamsign catalog</span>
            <div class="randomize-control__actions">
              <span
                class="randomize-control__status"
                id="dreamsign-catalog-status"
                aria-live="polite"
              >
                Loading catalog…
              </span>
              <button
                class="randomize-control__button"
                id="randomize-dreamsigns"
                type="button"
                disabled
              >
                Randomize shown
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const imageNumbers = [
        420863587, 435865921, 336703115, 386654065, 403770328, 245830771,
        443761768, 407121790, 236539174, 272291576, 258659153,
      ];
      const giftBackground = document.querySelector("#gift-background");
      const draftBackground = document.querySelector("#draft-background");
      const pickerChoices = document.querySelector("#picker-choices");
      const backgroundBlur = document.querySelector("#background-blur");
      const backgroundBlurValue = document.querySelector(
        "#background-blur-value",
      );
      const dreamsignSpread = document.querySelector("#dreamsign-spread");
      const dreamsignSpreadValue = document.querySelector(
        "#dreamsign-spread-value",
      );
      const draftSymbols = document.querySelector("#draft-symbols");
      const draftCaption = document.querySelector("#draft-caption");
      const dreamsignCountButtons = document.querySelectorAll(
        "[data-dreamsign-count]",
      );
      const draftDreamsignImages = draftSymbols.querySelectorAll(
        ".offer-tile__dreamsign",
      );
      const randomizeDreamsigns = document.querySelector(
        "#randomize-dreamsigns",
      );
      const dreamsignCatalogStatus = document.querySelector(
        "#dreamsign-catalog-status",
      );
      let dreamsignCatalog = [];

      function render(selectedIndex) {
        const selected = imageNumbers[selectedIndex];
        giftBackground.src = `/cards/${selected}.webp`;
        draftBackground.src = `/cards/${selected}.webp`;

        pickerChoices.querySelectorAll("button").forEach((button, index) => {
          button.setAttribute("aria-pressed", String(index === selectedIndex));
        });
      }

      imageNumbers.forEach((imageNumber, index) => {
        const button = document.createElement("button");
        button.className = "picker__choice";
        button.type = "button";
        button.setAttribute(
          "aria-label",
          `Use image ${imageNumber} behind both Dreamsign offers`,
        );
        button.setAttribute("aria-pressed", String(index === 0));

        const image = document.createElement("img");
        image.src = `/cards/${imageNumber}.webp`;
        image.alt = "";

        const label = document.createElement("span");
        label.textContent = String(imageNumber);

        button.append(image, label);
        button.addEventListener("click", () => render(index));
        pickerChoices.append(button);
      });

      backgroundBlur.addEventListener("input", () => {
        const blur = `${backgroundBlur.value}px`;
        document.documentElement.style.setProperty("--background-blur", blur);
        backgroundBlurValue.value = `${backgroundBlur.value} px`;
      });

      function setPercentageProperty(name, value) {
        const rounded = Math.round(value * 100) / 100;
        document.documentElement.style.setProperty(name, `${rounded}%`);
      }

      function updateDreamsignLayout() {
        const spread = Number(dreamsignSpread.value);
        const size = spread <= 17 ? 28 : 28 - (spread - 17) * 1.5;
        const halfSize = size / 2;
        const center = 50 - halfSize;
        const low = 50 - spread - halfSize;
        const high = 50 + spread - halfSize;
        const triangleHorizontalOffset = spread * (Math.sqrt(3) / 2);

        setPercentageProperty("--dreamsign-size", size);
        setPercentageProperty("--dreamsign-low", low);
        setPercentageProperty("--dreamsign-high", high);
        setPercentageProperty("--dreamsign-center", center);
        setPercentageProperty(
          "--dreamsign-triangle-left",
          50 - triangleHorizontalOffset - halfSize,
        );
        setPercentageProperty(
          "--dreamsign-triangle-right",
          50 + triangleHorizontalOffset - halfSize,
        );
        setPercentageProperty(
          "--dreamsign-triangle-bottom",
          50 + spread / 2 - halfSize,
        );
        dreamsignSpreadValue.value = `${spread}%`;
      }

      dreamsignSpread.addEventListener("input", updateDreamsignLayout);

      dreamsignCountButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const count = button.dataset.dreamsignCount;
          draftSymbols.dataset.count = count;
          draftCaption.textContent = `${count} choices · all shown`;
          dreamsignCountButtons.forEach((candidate) => {
            candidate.setAttribute(
              "aria-pressed",
              String(candidate === button),
            );
          });
        });
      });

      function sampleDreamsigns(count) {
        const pool = [...dreamsignCatalog];
        for (let index = 0; index < count; index += 1) {
          const randomIndex =
            index + Math.floor(Math.random() * (pool.length - index));
          [pool[index], pool[randomIndex]] = [pool[randomIndex], pool[index]];
        }
        return pool.slice(0, count);
      }

      randomizeDreamsigns.addEventListener("click", () => {
        const count = Number(draftSymbols.dataset.count);
        sampleDreamsigns(count).forEach((dreamsign, index) => {
          const image = draftDreamsignImages[index];
          image.src = `/dreamsigns/${encodeURIComponent(dreamsign.imageName)}`;
          image.alt = dreamsign.imageAlt || dreamsign.name;
          image.dataset.dreamsignId = dreamsign.id;
        });
        dreamsignCatalogStatus.textContent = `Randomized ${count} of ${dreamsignCatalog.length}`;
      });

      async function loadDreamsignCatalog() {
        try {
          const response = await fetch("/dreamsign-data.json");
          if (!response.ok) {
            throw new Error(`Catalog request failed with ${response.status}`);
          }
          const entries = await response.json();
          dreamsignCatalog = entries.filter(
            (entry) => entry.id && entry.imageName && entry.imageAlt,
          );
          if (dreamsignCatalog.length < 4) {
            throw new Error("Dreamsign catalog has fewer than four entries");
          }
          randomizeDreamsigns.disabled = false;
          dreamsignCatalogStatus.textContent = `${dreamsignCatalog.length} available`;
        } catch (error) {
          dreamsignCatalogStatus.textContent = "Catalog unavailable";
          console.warn(error);
        }
      }

      updateDreamsignLayout();
      void loadDreamsignCatalog();
    </script>
  </body>
</html>
