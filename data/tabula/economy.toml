# Version of the economy authoring contract consumed by the asset compiler.
schema-version = 1

[journey]
# Essence granted at journey genesis when the selected DreamAvatar has no
# starting-essence override of its own.
default-starting-essence = 200
# Maximum number of Dreamsigns a player may hold.
dreamsign-cap = 12

[shop.prices]
# Essence charged for a card in a regular Card Shop slot.
standard-card = 100
# Essence charged for a card in a Specialty Shop slot.
specialty-card = 200
# Essence charged for a Dreamsign in a Dreamsign Market slot.
dreamsign = 50

[shop.stock.card-shop]
# Number of card offers generated for each Card Shop visit.
card-slots = 5
# Number of Dreamsign offers generated for each Card Shop visit.
dreamsign-slots = 0

[shop.stock.specialty-shop]
# Number of card offers generated for each Specialty Shop visit.
card-slots = 5
# Number of Dreamsign offers generated for each Specialty Shop visit.
dreamsign-slots = 0

[shop.stock.dreamsign-market]
# Number of card offers generated for each Dreamsign Market visit.
card-slots = 0
# Number of Dreamsign offers generated for each Dreamsign Market visit.
dreamsign-slots = 3

[shop.discounts]
# Weighted distribution for how many generated shop slots receive a discount.
# Each value is a slot count; weight is its relative sampling likelihood.
slot-counts = [
  { value = 1, weight = 1 },
  { value = 2, weight = 1 },
]
# Weighted distribution for the discount applied to each selected slot.
# Each value is a percentage off the base price; weight is relative likelihood.
percentages = [
  { value = 30, weight = 1 },
  { value = 40, weight = 1 },
  { value = 50, weight = 1 },
  { value = 60, weight = 1 },
  { value = 70, weight = 1 },
  { value = 80, weight = 1 },
  { value = 90, weight = 1 },
]

[shop.reroll]
# Essence charged to reroll shop inventory at a standard site.
standard-price = 50
# Essence charged to reroll shop inventory at an enhanced site.
enhanced-price = 0
# Maximum number of inventory rerolls allowed during one shop visit.
max-per-visit = 1

[site-rewards.essence]
# Inclusive Essence award range for a standard Essence site.
standard = { min = 200, max = 300 }
# Inclusive Essence award range for an enhanced Essence site.
enhanced = { min = 400, max = 600 }

[site-rewards.reward]
# Inclusive Essence range used when a Reward site cannot offer a card reward.
fallback-essence = { min = 150, max = 350 }

[site-rewards.dreamsign-revelation]
# Number of Dreamsign choices offered at a standard Revelation site.
standard-offer-count = 3
# Number of Dreamsign choices offered at an enhanced Revelation site.
enhanced-offer-count = 4

[purge]
# Essence price of each successive paid purge during one visit. The first entry
# prices the first purge, and the number of entries is the paid-purge limit.
marginal-costs = [40, 60, 90, 130, 180, 240]
# Percentage removed from the summed purge price at an enhanced Purge site.
enhanced-discount-percent = 30

[transfiguration]
# Global lower and upper bounds applied to every final Essence quote.
minimum-cost = 0
maximum-cost = 100
# Size of the discrete Essence increments used when rolling band jitter.
step = 10
# Cost band used by free transformations. In any band, base is the center
# quote, jitter is the maximum seeded offset above or below base, and floor is
# the band's lower bound before the global bounds are applied.
free-band = { base = 0, jitter = 0, floor = 0 }

# Cost bands selected directly by the named Transfiguration form. Each form
# identity is code-owned; base, jitter, and floor use the meanings above.
[[transfiguration.form-bands]]
form = "Amplified"
base = 10
jitter = 20
floor = 10

[[transfiguration.form-bands]]
form = "Attuned"
base = 10
jitter = 20
floor = 10

[[transfiguration.form-bands]]
form = "Inspired"
base = 20
jitter = 20
floor = 10

[[transfiguration.form-bands]]
form = "Enduring"
base = 50
jitter = 30
floor = 20

[[transfiguration.form-bands]]
form = "Resonant"
base = 50
jitter = 30
floor = 20

[[transfiguration.form-bands]]
form = "Perfected"
base = 100
jitter = 0
floor = 100

# Cost bands selected by the magnitude of a stat change. minimum-delta and
# maximum-delta are inclusive; omitting maximum-delta makes the final band 4+.
[[transfiguration.stat-delta-bands]]
minimum-delta = 1
maximum-delta = 1
base = 10
jitter = 20
floor = 10

[[transfiguration.stat-delta-bands]]
minimum-delta = 2
maximum-delta = 2
base = 30
jitter = 20
floor = 10

[[transfiguration.stat-delta-bands]]
minimum-delta = 3
maximum-delta = 3
base = 50
jitter = 20
floor = 30

[[transfiguration.stat-delta-bands]]
minimum-delta = 4
base = 70
jitter = 20
floor = 50

[battle-reward]
# Essence awarded before completion-level scaling and reward modifiers.
base-essence = 100
# Essence added for each completion level before reward modifiers.
essence-per-completion-level = 50
# Lower bound applied to the final Essence reward after modifiers.
minimum-essence = 0

[gamble.three-gate]
# Essence committed when starting Three-Gate at a standard site.
standard-wager = 50
# Essence committed when starting Three-Gate at an enhanced site.
enhanced-wager = 45
# Essence paid for reaching the code-owned Six, Nine, or Jack gate.
rewards = { six = 100, nine = 150, jack = 200 }

[gamble.ladder-climb]
# Essence awarded for each winning Ladder Climb attempt.
win-essence = 25
# Cost schedule by one-based attempt number. Standard and enhanced costs are
# the Essence committed before that attempt is played.
attempts = [
  { attempt = 1, standard-cost = 0, enhanced-cost = 0 },
  { attempt = 2, standard-cost = 5, enhanced-cost = 0 },
  { attempt = 3, standard-cost = 10, enhanced-cost = 0 },
  { attempt = 4, standard-cost = 15, enhanced-cost = 0 },
]

[gamble.starway-stairs]
# Essence committed when starting Starway Stairs at a standard site.
standard-wager = 30
# Essence committed when starting Starway Stairs at an enhanced site.
enhanced-wager = 20
# Essence payout for cashing out at each one-based, code-owned reward tier.
tiers = [
  { tier = 1, essence-reward = 60 },
  { tier = 2, essence-reward = 140 },
  { tier = 3, essence-reward = 300 },
]

[gamble.four-suit-reprise]
# Essence charged for each draw at a standard or enhanced Gamble site.
standard-draw-price = 25
enhanced-draw-price = 15
# Essence granted when the drawn suit resolves to the Essence outcome.
essence-reward = 100

[exploration]
# Fallback Essence granted per spark by Exploration effects. An encounter's
# essence-per-spark value in exploration.toml takes precedence when present.
default-essence-per-spark = 40
