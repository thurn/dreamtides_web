# Dream Atlas rules and presentation data. The runtime consumes the validated
# public/atlas-data.json projection generated by scripts/setup-assets.mjs.

schema-version = 1

[[layers]]
name = "one"
role = "starter"
node-count = { min = 1, max = 1 }
mandatory-sites = {}

[[layers]]
name = "two"
role = "standard"
node-count = { min = 2, max = 2 }
site-count = { min = 3, max = 6 }
fill-profile = "early"
mandatory-sites = { Draft = 2, Purge = 1, Augury = 1 }

[[layers]]
name = "three"
role = "standard"
node-count = { min = 3, max = 3 }
site-count = { min = 3, max = 6 }
fill-profile = "early"
mandatory-sites = { Draft = 1, Purge = 1 }

[[layers]]
name = "four"
role = "standard"
node-count = { min = 3, max = 4 }
site-count = { min = 3, max = 6 }
fill-profile = "early"
mandatory-sites = { Draft = 1 }

[[layers]]
name = "five"
role = "standard"
node-count = { min = 3, max = 5 }
site-count = { min = 3, max = 6 }
fill-profile = "late"
mandatory-sites = {}

[[layers]]
name = "six"
role = "standard"
node-count = { min = 3, max = 5 }
site-count = { min = 3, max = 6 }
fill-profile = "late"
mandatory-sites = {}

[[layers]]
name = "seven"
role = "boss"
node-count = { min = 1, max = 1 }
site-count = { min = 3, max = 6 }
fill-profile = "late"
mandatory-sites = {}

[graph]
connection-average = 2.0
reveal-lookahead-layers = 2

[graph.bonus-reveal]
min = 0
max = 2
mode = 1
eligible-layers = ["five", "six"]

[dreamscape-selection]
base-weight = 1.0
repeat-discourage-strength = 2.0
exclude-connected-repeats = true
exclude-same-layer-repeats = true
exhaustion-fallback = "allow-repeats"

[site-composition]
unique-non-draft-sites = true
known-dreamsign-site = "Reward"
mandatory-capacity-behavior = "omit-fill"

[[fill-profiles]]
id = "early"
signature-site-weight = 3.0
site-weights = { Essence = 3.0, Transfiguration = 1.0, Duplication = 1.0 }

[[fill-profiles]]
id = "late"
signature-site-weight = 3.0
site-weights = { Essence = 3.0, Transfiguration = 5.0, Duplication = 5.0 }

[known-dreamsign]
max-per-atlas = 2
eligible-layers = ["three", "four", "five", "six"]
placement-probability = 0.5
early-reveal-bias = 1.0

[random-site]
destinations = [
  "Shop",
  "DreamsignMarket",
  "DreamsignRevelation",
  "Transfiguration",
  "Duplication",
  "Purge",
  "Augury",
  "Gamble",
  "Exploration",
]
home-choice-count = 3
away-choice-count = 1
guide-line = "Three roads. Pick your poison."

[[site-types]]
type = "Battle"
icon = "bxf bx-sword-alt"
glossary-id = "site-battle"

[[site-types]]
type = "Draft"
icon = "bxf bx-rectangle-vertical"
glossary-id = "site-draft"

[[site-types]]
type = "Shop"
icon = "bxf bx-store-alt-2"
glossary-id = "site-shop"

[[site-types]]
type = "Purge"
icon = "bxf bx-hot"
glossary-id = "site-purge"

[[site-types]]
type = "Essence"
icon = "bxf bx-diamond-alt"
glossary-id = "site-essence"

[[site-types]]
type = "Transfiguration"
icon = "fa-solid fa-hammer"
glossary-id = "site-transfiguration"

[[site-types]]
type = "Duplication"
icon = "bxf bx-copy"
glossary-id = "site-duplication"

[[site-types]]
type = "Reward"
icon = "bxf bx-treasure-chest"
glossary-id = "site-reward"

[[site-types]]
type = "Augury"
icon = "bxf bx-eye"
glossary-id = "site-augury"

[[site-types]]
type = "DreamsignMarket"
icon = "bxf bx-pyramid"
glossary-id = "site-dreamsign-market"

[[site-types]]
type = "DreamsignRevelation"
icon = "bxf bx-meteor"
glossary-id = "site-dreamsign-revelation"

[[site-types]]
type = "RandomSite"
icon = "fa-solid fa-question"
glossary-id = "site-random-site"

[[site-types]]
type = "Gamble"
icon = "bxf bx-coin"
glossary-id = "site-gamble"

[[site-types]]
type = "Exploration"
icon = "bxf bx-compass"
glossary-id = "site-exploration"

[fallback-site-type]
icon = "bx bx-help-circle"
name = "Unknown Site"
description = "An unfamiliar site from an earlier dream."

[boss]
dreamscape-id = "limbo"
place = "Limbo"
name = "Apollyon"
fallback-title = "Apollyon, the Doom of Humanity"
fallback-introduction = "An avatar of annihilating power — his own deck, dreamsigns, and abilities bend the dream toward ruin."
scene-art-id = "limbo"
icon-art-id = "limbo"
figure-art-id = "apollyon"

[presentation]
unseen-title = "An Unseen Dream"
unseen-body = "This dreamscape is revealed only as you draw near. Travel onward to learn what waits here."
starter-body = "A quiet place where every dream journey begins."
affiliation-title-template = "Affiliation: {name}"
affiliation-body-template = "{card-theme} cards are more likely here."

[assets]
unrevealed-frame-source = "Round_frame_main.png"
unrevealed-frame-key = "Round_frame_main.png"
boss-scene-source = "limbo.png"
boss-icon-source = "limbo_icon.png"
boss-figure-source = "apollyon.png"
