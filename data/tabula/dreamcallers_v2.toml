# Dreamcaller identities — v2 ability set
# ---------------------------------------
# Each entry pairs a Dreamcaller's name, title, art, and id with one of the 32
# v2 abilities. The name and art are carried over from the v1 Dreamcaller whose
# flavor best fits the new ability. Starting essence is left unset and assigned
# separately.
#
# `signature-cards` is the standard `idf3` draft-pool steering data: a short list
# of distinctive card names standing in for "what this Dreamcaller wants to do".
# `idf3` uses it to locate the real decks that most embody the Dreamcaller and
# bias pool construction toward them (see `docs/cards2/idf3_signature_design.md`).

