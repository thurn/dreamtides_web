# Augury encounter composition, offer weights, dialogue, and player-facing copy.
# Archetype ids are stable code contracts; designers can enable, weight, and
# rewrite an archetype here without editing TypeScript.

schema-version = 1

[encounter]
# Number of visions generated for one Augury visit.
offer-count = 2
# When true, the second vision must come from a different offer family.
distinct-families = true
# When true, the player may leave without accepting either vision.
allow-decline = true

[dialogue]
# Used if an encounter cannot resolve an archetype-specific line.
fallback-line = "Something here was meant for you."
# Seeded post-acceptance reactions; one is shown after the chosen vision resolves.
accept-reactions = [
  "It already looks at home with you.",
  "The dream settles. Go well.",
  "A fair bargain, and a quiet one.",
  "Carry it gently. It will carry you.",
  "There. The road feels lighter now.",
  "The dark approves, I think.",
  "Some trades the morning never undoes.",
]

# Each archetype defines its family, lottery weight, selection policy, quantity
# knobs, dialogue bank, and copy templates. Supported copy slots are {card},
# {cards}, {count}, {count-word}, {category}, {site}, {subtype}, and
# {transfiguration}, {copies}, {copies-word}, and {copies-label}. A template may
# omit every slot. {copies-label} is singular or plural as appropriate.
# `enabled` controls whether the implemented builder enters the lottery.
# `family` groups offers so the two visions can be required to differ.
# `weight` is the relative lottery weight among enabled, eligible archetypes.
# `selection-policy-id` chooses the shared reward-ranking/sampling policy.
# Values under `quantities` control only the collections named for that
# archetype. Unknown keys are rejected. Card chooser sizes are between 2 and 4.
# `chooser-size` is the exact number of visible candidates.
# `granted-copies` is how many copies of the selected card enter the deck.
# `bundle-size` and `minimum-bundle-size` bound the seeded bundle count.
# `maximum-targets` caps how many starter cards are improved together.
# `minimum-chooser-size` and `maximum-chooser-size` bound a seeded chooser count.
# An empty quantities table means the archetype has no numeric designer knobs.
# `dialogue-lines` is the seeded bank spoken when this archetype is featured.
# Under `copy`, title/summary describe the offer tile, prompt describes a chooser,
# candidate-title/candidate-summary describe one chooser entry, and
# detail-headline/detail-subtitle describe the expanded offer panel.

[[archetype]]
id = "fit_card_grant"
enabled = true
family = "grant"
weight = 10
selection-policy-id = "card-fit"
dialogue-lines = [
  "Some things drift a long way only to find their owner.",
  "I kept this shaped like the hollow you carry.",
  "It has been waiting to belong to someone. To you.",
  "A stranger that will feel like an old friend.",
  "This was always going to end up in your hands.",
]
[archetype.quantities]
granted-copies = 1
[archetype.copy]
title = "Receive {card}"
summary = "Add {copies-word} {copies-label} of this card to your deck."
prompt = ""
candidate-title = "{card}"
candidate-summary = "Add {copies-word} {copies-label} of this card to your deck."
detail-headline = "Gain a Card"
detail-subtitle = "Gain {card}"

