# Apollyon incarnations: the final DreamAvatar's ten guises. During Dreamscape
# generation one incarnation is chosen to present Apollyon, swapping in that
# guise's title and short deck description.
#
# Fields:
#   id           Stable identifier for the incarnation.
#   title        Player-facing epithet shown as Apollyon's title.
#   description  Short, surfaced description of the incarnation's deck.
#   deck-type    Internal deck-archetype label. Recorded for design reference
#                only; never shown in the UI.

[[incarnations]]
id = "howl_at_worlds_end"
title = "Apollyon, the World's End"
description = "Apollyon has the Aspect of Ravening: Spirit animals multiply, then rise as one devouring chorus."
deck-type = "Spirit Animal Flood"

