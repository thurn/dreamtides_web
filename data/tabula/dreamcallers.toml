# Per-Dreamcaller starting essence
# ---------------------------------
# Each Dreamcaller begins a quest with a tuned `starting-essence` value to
# compensate for differences in opening power, late-game scaling, and
# activation cost. The cheaper a Dreamcaller's win condition is to assemble,
# the lower the starting essence; the slower the engine ramps or the more it
# costs to fire each turn, the higher it starts.
#
# Tier guide:
#   * 220-235 — Strong, immediate, "free" abilities that need little setup.
#                 Lower essence offsets the natural tempo lead.
#   * 240-255 — Conditional or curve-dependent engines. The default band.
#   * 260-275 — Slow openings, expensive activations, or fragile setups.
#                 Extra essence covers the early shop/site bumps needed to
#                 reach the payoff.
#   * 280+   — Late-game scalers whose payoff requires several quest stops
#                 of investment before it stabilizes.

