# Dream Guides: the resident character of each non-starter dreamscape. A guide
# enhances their dreamscape's signature site type when the player visits the
# guide's home dreamscape. The `home-specialty` describes that enhancement.
#
# Fields:
#   id                  Stable identifier referenced by dreamscapes.
#   name                Player-facing guide name.
#   home-dreamscape-id  The dreamscape this guide calls home.
#   site-type           The SiteType this guide enhances (the home dreamscape's
#                       signature site).
#   dialog              Placeholder greeting lines spoken on arrival.
#   home-specialty      Description of the enhancement granted at the home site.

[[guides]]
id = "tobias_tanglefur"
name = "Tobias Tanglefur"
home-dreamscape-id = "tumbleleaf_village"
site-type = "Shop"
dialog = [
  "Welcome, friend! Browse a while.",
  "I've set aside something just for you.",
]
home-specialty = "Tobias offers strong cards at a steep discount."

