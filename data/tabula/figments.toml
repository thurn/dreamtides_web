# Figment catalog (rules §Figments). Each entry is one of the fixed figment
# types a card effect can create. The figment editor (/figments) reads and
# writes this file, and the battle UI sources a figment's name, character type,
# spark, rules text, and art from the matching entry by subtype.
#
# `keyword` is the type's implicit combat keyword (one of "unstoppable",
# "vengeful", "awakened", or "" for none) and is carried by every figment of the
# type. `spark` is the base spark of a single figment; a Legion's spark is the
# live allied-warrior count, so its base value is the per-warrior rate.

