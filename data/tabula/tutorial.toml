priority = 100
duration = 3
bubbleWidth = 500
match = { kind = "glossary", id = "prevent" }
text = "[yellow]Prevent[/yellow] stops a card on the stack before it resolves, then sends it to the void."

[[triggers]]
id = "rematerialize"
on = [ "card-seen", "card-play", "dreamwell-resolve" ]
priority = 100
duration = 3
bubbleWidth = 500
match = { kind = "glossary", id = "rematerialize" }
