[[triggers]]
id = "support"
on = [ "card-seen", "card-play", "dreamwell-resolve" ]
priority = 100
duration = 5
match = { kind = "glossary", id = "support" }
bubbleWidth = 500
text = "A character with [yellow]support[/yellow] gives a bonus to the characters in front of it."

[[triggers]]
id = "foresee"
on = [ "card-seen", "card-play", "dreamwell-resolve" ]
priority = 100
duration = 5
bubbleWidth = 500
match = { kind = "glossary", id = "foresee" }
text = "To [yellow]foresee[/yellow] 1, look at the top card of your deck. You may put it into your void."

[[triggers]]
id = "dissolved-trigger"
on = [ "card-seen", "card-play" ]
priority = 100
duration = 3
bubbleWidth = 500
match = { kind = "glossary", id = "dissolved-trigger" }
text = "A ▸Dissolved ability triggers when the character is sent to the void."

[[triggers]]
id = "discover"
on = [ "card-seen", "card-play", "dreamwell-resolve" ]
priority = 100
duration = 3
bubbleWidth = 500
match = { kind = "glossary", id = "discover" }
text = "When you [yellow]discover[/yellow] a character, reveal 3 matching from your deck and pick one to draw."

[[triggers]]
id = "erode"
on = [ "card-seen", "card-play", "dreamwell-resolve" ]
priority = 100
duration = 10
bubbleWidth = 500
match = { kind = "glossary", id = "erode" }
text = "[yellow]Erode[/yellow] means to put cards from a deck into the void. If the deck is empty, the opposing player scores 3⍟ per card instead."

[[triggers]]
id = "figment-created"
on = [ "figment-created" ]
priority = 100
duration = 8
bubbleWidth = 500
match = { kind = "any" }
text = "Figments are token representations of characters. Multiple figments of the same type can be combined to form one character."

[[triggers]]
id = "banish"
on = [ "card-seen", "card-play", "dreamwell-resolve" ]
priority = 100
duration = 3
bubbleWidth = 500
match = { kind = "glossary", id = "banish" }
text = "To [yellow]banish[/yellow] a card, remove it from the battle. It does not go to the void."

[[triggers]]
id = "dissolve"
