# Ordered actions and playable-battle draw sequences for the standalone tutorial.

[journeyStart.speechBubble]
speaker = "mira"
horizontalOffset = 40
verticalOffset = 0
bubbleWidth = 550
text = "For each journey, you must choose a [purple]Dream Avatar[/purple] who provides a permanent ability."

[dreamscape.speechBubble]
speaker = "mira"
delay = 2
horizontalOffset = 0
verticalOffset = 0
bubbleWidth = 700
text = "In each dream you will visit [purple]Dream Sites[/purple] to build your deck before confronting the Guardian of this dream."

