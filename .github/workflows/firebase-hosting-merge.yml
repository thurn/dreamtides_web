# Deploys the built site to the Firebase Hosting `live` channel on every push
# to master.
#
# firebase-tools authenticates by exchanging the service-account JWT for a Google
# OAuth access token. That token request (https://www.googleapis.com/oauth2/v4/token)
# intermittently fails on GitHub-hosted runners with "Premature close" — the TLS
# connection is reset partway through the response, surfacing as "Failed to
# authenticate, have you run firebase login?". It fails before any files are
# uploaded and reports no Google-side error reason, i.e. a transport-level reset
# rather than a credential or quota problem. Two mitigations:
#
#   * --dns-result-order=ipv4first — premature-close to googleapis.com on CI is
#     most often a flaky IPv6 egress path (the connection lands on an AAAA
#     address that black-holes mid-response). Preferring IPv4 avoids that path.
#   * retry-with-backoff — absorbs any residual transient reset regardless of
#     cause, instead of failing the whole deploy on the first blip.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master

# Serialize live deploys so two master pushes landing close together don't race
# each other on the same hosting channel. `cancel-in-progress: false` keeps every
# commit's deploy queued rather than dropping intermediate ones.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - name: Write service account credentials
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUEST_PROTOTYPE_D7027 }}
      - name: Deploy to Firebase Hosting (live)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 4
          retry_wait_seconds: 30
          command: npx --yes firebase-tools@latest deploy --only hosting --project redacted-firebase-project --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          NODE_OPTIONS: --dns-result-order=ipv4first
