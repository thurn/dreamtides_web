# Deploys the built site to the Firebase Hosting `live` channel on every push
# to master.
#
# Node is pinned to 24.16.0 via actions/setup-node. firebase-tools mints its
# Google OAuth access token (https://www.googleapis.com/oauth2/v4/token) through
# node-fetch in apiv2.js. Node 24.17.0 shipped a security fix ("http: fix
# response queue poisoning in http.Agent") that regressed keep-alive socket
# reuse for node-fetch, so the token-fetch response body is cut mid-stream and
# surfaces as "Invalid response body ... Premature close" / "Failed to
# authenticate, have you run firebase login?". The deploy never reaches file
# upload. Node 24.16.0 predates the regression and exchanges the token cleanly,
# which is also the version used for local development (see .nvmrc). Without the
# pin the runner installs the latest 24.x, which carries the regression.
#
# References: nodejs/node#63989, firebase/firebase-tools#10692.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master

# Serialize live deploys so two master pushes landing close together don't race
# each other on the same hosting channel. `cancel-in-progress: false` keeps every
# commit's deploy queued rather than dropping intermediate ones.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUEST_PROTOTYPE_D7027 }}
          channelId: live
          projectId: redacted-firebase-project
