# Runs the project's maintained core checks (lint, typecheck, validation, and
# unit tests) on every push to master and every pull request.
#
# `workflow_dispatch` is included so this workflow can be triggered manually
# on a non-master branch (its `push`/`pull_request` triggers alone would never
# fire on a feature branch pushed without an open PR).

name: Checks
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Validation is only actionable for the newest version of a branch or pull
# request. Superseded runs otherwise consume hosted-runner capacity and can
# leave the current commit waiting behind stale work during an Actions outage.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pin Node to 24.16.0: Node 24.17.0 regressed node-fetch keep-alive socket
      # reuse, breaking firebase-tools' OAuth token fetch with "Premature
      # close" (see firebase-hosting-merge.yml).
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - run: npm ci
      - run: npm run review:full
        env:
          JOURNEY_TEST_WORKERS: "4"
