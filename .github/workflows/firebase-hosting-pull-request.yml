name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/game-data
      # Pin Node to 24.16.0: Node 24.17.0 regressed node-fetch keep-alive socket
      # reuse, breaking the firebase-tools OAuth token fetch with "Premature
      # close". See firebase-hosting-merge.yml for the full explanation.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUEST_PROTOTYPE_D7027 }}
          projectId: redacted-firebase-project
